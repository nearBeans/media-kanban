<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/css/sanitize.css">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Media Kanban</title>
</head>

<body>
    <main id="auth-panel" class="auth-panel">
        <h1>Media Kanban</h1>
        <p id="auth-message" role="status" aria-live="polite"></p>
        <button id="passkey-login" type="button">パスキーでログイン</button>
        <form id="request-recovery-code-form">
            <h2>アカウント復旧</h2>
            <p>登録済みの復旧用メールアドレスへ、一度だけ使えるコードを送信します。</p>
            <label>
                復旧用メールアドレス
                <input name="email" type="email" maxlength="254" autocomplete="email" required>
            </label>
            <button type="submit">復旧コードをメールで送信</button>
        </form>
        <form id="initial-registration">
            <h2>初回登録</h2>
            <label>
                表示名
                <input name="name" type="text" maxlength="60" autocomplete="nickname" required>
            </label>
            <label>
                初回登録コード
                <input name="inviteCode" type="password" autocomplete="off" required>
            </label>
            <button type="submit">パスキーを登録して開始</button>
        </form>
    </main>
    <main id="recovery-code-panel" class="auth-panel recovery-code-panel" hidden>
        <h1>アカウント復旧</h1>
        <p id="recovery-code-message" role="status" aria-live="polite"></p>
        <form id="recovery-form">
            <h2>復旧コードを入力</h2>
            <label>
                メールで届いた復旧コード
                <input name="recoveryCode" type="text" maxlength="40" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required>
            </label>
            <button type="submit">復旧して新しいパスキーを登録</button>
        </form>
        <button id="back-to-recovery-email" type="button">メールアドレス入力に戻る</button>
    </main>
    <header id="account-bar" class="account-bar" hidden>
        <span id="account-name"></span>
        <span id="app-message" role="status" aria-live="polite"></span>
        <button id="manage-recovery-email" type="button">復旧設定</button>
        <button id="sign-out" type="button">ログアウト</button>
    </header>
    <dialog id="recovery-dialog" class="recovery-dialog">
        <h2>アカウント復旧設定</h2>
        <p id="recovery-dialog-message" role="status" aria-live="polite"></p>
        <p id="recovery-email-status"></p>
        <form id="recovery-email-form">
            <label>
                復旧用メールアドレス
                <input name="email" type="email" maxlength="254" autocomplete="email" required>
            </label>
            <button type="submit">確認メールを送信／再送</button>
        </form>
        <button id="confirm-recovery-email" type="button" hidden>メールアドレスを確認する</button>
        <p>確認済みのメールアドレスに、一度だけ使える復旧コードをメール送信します。コードは20分で期限切れになります。</p>
        <button id="close-recovery-dialog" type="button">閉じる</button>
    </dialog>
    <dialog id="recovery-email-confirmed-dialog" class="recovery-dialog recovery-email-confirmed-dialog">
        <p id="recovery-email-confirmed-message"></p>
        <button id="close-recovery-email-confirmed" type="button">閉じる</button>
    </dialog>
    <section class="yet" data-status="yet" hidden>
        <h1>未視聴・未読</h1>
        <div class="add-card-area">
            <button class="add-card-trigger" type="button" aria-label="未視聴・未読にカードを追加" aria-expanded="false">+</button>
        </div>
    </section>
    <section class="now" data-status="now" hidden>
        <h1>視聴中・読書中</h1>
        <div class="add-card-area">
            <button class="add-card-trigger" type="button" aria-label="視聴中・読書中にカードを追加" aria-expanded="false">+</button>
        </div>
    </section>
    <section class="done" data-status="done" hidden>
        <h1>完結・読了</h1>
        <div class="add-card-area">
            <button class="add-card-trigger" type="button" aria-label="完結・読了にカードを追加" aria-expanded="false">+</button>
        </div>
    </section>
    <section class="stop" data-status="stop" hidden>
        <h1>断念</h1>
        <div class="add-card-area">
            <button class="add-card-trigger" type="button" aria-label="諦めにカードを追加" aria-expanded="false">+</button>
        </div>
    </section>
    <script type="module" src="src/js/main.js"></script>
</body>

</html>
